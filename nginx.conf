events {
    worker_connections 1024;
}

http {
    upstream backend {
        server 127.0.0.1:5000;
        server 127.0.0.1:5001;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name airline.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name airline.local;
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location /api/ {
            limit_req zone=api_limit burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_intercept_errors on;
        }

        location /docs/ {
            alias /var/www/data/docs;
        }

        location /admin/ {
            auth_basic "Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://backend;
        }

        error_page 404 /404.html;
        location = /404.html {
            root /var/www/data/;
            internal;
        }
    }

    server {
        listen 443 ssl;
        server_name second.local;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location / {
            return 200 "Second application.\n";
        }
    }
}
